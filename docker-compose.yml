services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d payment_gateway"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    container_name: postgres_container
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway 
      POSTGRES_DB: payment_gateway
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrations:
    image: migrate/migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://gateway:gateway@postgres:5432/payment_gateway?sslmode=disable"
      - "up"
    restart: "no"

  payment_gateway:
    build: 
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    container_name: payment_gateway_container
    environment:
      DATABASE_URL: postgres://gateway:gateway@postgres:5432/payment_gateway
      PORT: "8080"
      BANK_BASE_URL: ${BANK_BASE_URL:-http://host.docker.internal:8787}
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped


volumes:
  postgres_data:  