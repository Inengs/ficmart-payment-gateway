openapi: 3.0.3

info:
  title: Ficmart Payment Gateway API
  description: Payment gateway for Ficmart
  version: 1.0.0

servers:
  - url: http://localhost:8080

tags:
  - name: Payments
    description: Operations related to payments/ POST operations
  - name: Queries
    description: Operations related to queries/ GET operations

paths:
  /health:
    get:
      tags: [Queries]
      summary: Liveness check
      responses:
        "200":
          description: Service is up

  /payments/authorize:
    post:
      tags: [Payments]
      summary: Authorize a payment (reserve funds)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizeRequest"
      responses:
        "200":
          description: Payment authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400": { $ref: "#/components/responses/ValidationError" }
        "402": { $ref: "#/components/responses/CardError" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/BankUnavailable" }

  /payments/{id}/capture:
    post:
      tags: [Payments]
      summary: Capture an authorized payment
      parameters:
        - $ref: "#/components/parameters/PaymentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Payment captured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/BankUnavailable" }

  /payments/{id}/void:
    post:
      tags: [Payments]
      summary: Void an authorized payment
      parameters:
        - $ref: "#/components/parameters/PaymentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Payment voided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/BankUnavailable" }

  /payments/{id}/refund:
    post:
      tags: [Payments]
      summary: Refund a captured payment
      parameters:
        - $ref: "#/components/parameters/PaymentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Payment refunded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/BankUnavailable" }

  /payments/{id}:
    get:
      tags: [Queries]
      summary: Get a payment by ID
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: The payment receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "404": { $ref: "#/components/responses/NotFound" }

  /orders/{order_id}/payment:
    get:
      tags: [Queries]
      summary: Get the payment for an order
      parameters:
        - name: order_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The payment receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "404": { $ref: "#/components/responses/NotFound" }

  /customers/{customer_id}/payments:
    get:
      tags: [Queries]
      summary: List a customer's payments, newest first
      parameters:
        - name: customer_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The customer's payments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentList"

components:
  responses:
    ValidationError:
      description: Request body or parameters are invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: VALIDATION_ERROR
            message: amount must be greater than 0

    CardError:
      description: Card declined, expired, or insufficient funds
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: INSUFFICIENT_FUNDS
            message: the card has insufficient funds

    NotFound:
      description: Payment does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: PAYMENT_NOT_FOUND
            message: no payment found for that identifier

    Conflict:
      description: Invalid state transition, or idempotency key reused with a different body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: INVALID_STATE_TRANSITION
            message: a voided payment cannot be captured

    BankUnavailable:
      description: Bank failed after all retries; payment state is unchanged
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: BANK_UNAVAILABLE
          
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique per logical request. Retrying with the same key returns the original response.
      schema:
        type: string
        minLength: 1

    PaymentId:
      name: id
      in: path
      required: true
      description: Gateway payment ID
      schema:
        type: string

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - CARD_DECLINED
            - CARD_EXPIRED
            - INSUFFICIENT_FUNDS
            - PAYMENT_NOT_FOUND
            - INVALID_STATE_TRANSITION
            - IDEMPOTENCY_CONFLICT
            - BANK_UNAVAILABLE
        message:
          type: string


    PaymentStatus:
      type: string
      enum: [PENDING, AUTHORIZED, CAPTURED, VOIDED, REFUNDED]

    AuthorizeRequest:
      type: object
      required:
        - order_id
        - customer_id
        - amount
        - card_number
        - cvv
        - expiry_month
        - expiry_year
      properties:
        order_id:
          type: string
        customer_id:
          type: string
        amount:
          type: integer
          minimum: 1
          description: Amount in cents (5000 = $50.00)
        currency:
          type: string
          enum: [USD]
          default: USD
        card_number:
          type: string
          writeOnly: true
          pattern: "^[0-9]{13,19}$"
        cvv:
          type: string
          writeOnly: true
          pattern: "^[0-9]{3,4}$"
        expiry_month:
          type: integer
          minimum: 1
          maximum: 12
        expiry_year:
          type: integer

    Payment:
      type: object
      required: [payment_id, order_id, customer_id, amount, currency, status, created_at, updated_at]
      properties:
        payment_id:
          type: string
        order_id:
          type: string
        customer_id:
          type: string
        amount:
          type: integer
          description: Amount in cents
        currency:
          type: string
          example: USD
        status:
          $ref: "#/components/schemas/PaymentStatus"
        card_last_four:
          type: string
          example: "1111"
        bank_auth_id:
          type: string
          nullable: true
        bank_capture_id:
          type: string
          nullable: true
        bank_void_id:
          type: string
          nullable: true
        bank_refund_id:
          type: string
          nullable: true
        authorized_at:
          type: string
          format: date-time
          nullable: true
        captured_at:
          type: string
          format: date-time
          nullable: true
        voided_at:
          type: string
          format: date-time
          nullable: true
        refunded_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaymentList:
      type: array
      items:
        $ref: "#/components/schemas/Payment"