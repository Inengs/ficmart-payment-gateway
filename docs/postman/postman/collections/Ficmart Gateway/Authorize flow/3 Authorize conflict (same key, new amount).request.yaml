$kind: http-request
url: "{{base_url}}/payments/authorize"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{idem_key}}"
body:
  type: text
  content: '{"order_id":"{{order_id}}","customer_id":"c1","amount":6000,"currency":"USD","card_number":"4111111111111111","cvv":"123","expiry_month":12,"expiry_year":2030}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('409 IDEMPOTENCY_CONFLICT', () => {
        pm.response.to.have.status(409);
        pm.expect(pm.response.json().code).to.eql('IDEMPOTENCY_CONFLICT');
      });
    language: text/javascript
order: 3000
