$kind: http-request
url: "{{base_url}}/payments/00000000-0000-0000-0000-000000000000/capture"
method: POST
headers:
  Idempotency-Key: f-cap-unknown-{{ts}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('404 PAYMENT_NOT_FOUND', () => {
        pm.response.to.have.status(404);
        pm.expect(pm.response.json().code).to.eql('PAYMENT_NOT_FOUND');
      });
    language: text/javascript
order: 8000
